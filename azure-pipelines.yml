          appName: 'Platinum-V3-MBM-AFS-Postgres-API'
          runtimeStack: 'NODE|22-lts'
          package: 'AFS-UI/api'
          startUpCommand: 'npx tsx index.ts'

  - job: Payroll_API_MBM
    displayName: 'Payroll (MBM) → Platinum-V3-MBM-Payroll-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: NodeTool@0
        inputs: { versionSpec: '22.x' }
      - script: |
          cd PAYROLL-APP
          npm ci --legacy-peer-deps
        displayName: 'Install Payroll API deps'
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-MBM-Payroll-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-MBM-Payroll-Postgres-API'
          runtimeStack: 'NODE|22-lts'
          package: 'PAYROLL-APP'
          startUpCommand: 'node src/server/index.js'   # adjust to PAYROLL-APP's real entry
