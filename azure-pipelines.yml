# ─────────────────────────────────────────────────────────────────────────────
# Platinum v3.1 — Azure DevOps CI/CD
# Builds & deploys the main UI (shell) + the Postgres-backed APIs to Azure App Service.
#
# Secrets/DB connection strings are NOT here — they live in each web app's
# App Settings (Portal). This pipeline only builds and pushes code.
#
# Prereqs (one-time, in Azure DevOps):
#   • An ARM service connection named exactly = $(azureSubscription) below,
#     scoped to the resource group that holds the web apps.
#   • The web apps already created in the Portal (see the runbook).
# ─────────────────────────────────────────────────────────────────────────────

trigger:
  branches:
    include:
      - Dev           # auto-run on every commit to Dev
      - main          # (and main, if/when you promote there)

variables:
  azureSubscription: 'EMS_Dev (04293d85-6ede-4d45-b918-d9c5738950b9)'   # exact ARM service connection name
  vmImage: 'ubuntu-latest'
  buildConfiguration: 'Release'

stages:
- stage: Deploy
  displayName: 'Build & Deploy'
  jobs:

  # ========== MAIN UI (Angular shell, Node runtime) ==========
  - job: Shell_UI
    displayName: 'Shell → Platinum-V3-UI'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: NodeTool@0
        inputs: { versionSpec: '22.x' }
      - script: npm ci --legacy-peer-deps
        displayName: 'Install monorepo dependencies'
      - script: |
          cd apps/shell
          npx ng build --configuration production
        displayName: 'Build Angular shell (prod)'
      - script: |
          set -e
          PKG="$(Build.ArtifactStagingDirectory)/shell"
          mkdir -p "$PKG"
          cp apps/shell/server.js "$PKG/"
          cp apps/shell/package.json "$PKG/"
          cp -r dist/shell/browser "$PKG/browser"
          # bundle the 3 runtime deps so the app starts without an Oryx build
          (cd "$PKG" && npm install --omit=dev)
        displayName: 'Assemble shell deploy package'
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-UI'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-UI'
          runtimeStack: 'NODE|22-lts'
          package: '$(Build.ArtifactStagingDirectory)/shell'
          startUpCommand: 'node server.js'

  # ========== .NET POSTGRES APIs ==========
  - job: IDP_API
    displayName: 'IDP → Platinum-V3-IDP-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: UseDotNet@2
        inputs: { packageType: 'sdk', version: '10.0.x' }
      - task: DotNetCoreCLI@2
        displayName: 'dotnet publish (IDP)'
        inputs:
          command: 'publish'
          publishWebProjects: false
          projects: 'IDP-UI/PlatinumIDP/PlatinumIDP.csproj'
          arguments: '-c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/idp'
          zipAfterPublish: true
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-IDP-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-IDP-Postgres-API'
          package: '$(Build.ArtifactStagingDirectory)/idp/**/*.zip'

  - job: Budget_API
    displayName: 'Budget → Platinum-V3-Budget-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: UseDotNet@2
        inputs: { packageType: 'sdk', version: '10.0.x' }
      - task: DotNetCoreCLI@2
        displayName: 'dotnet publish (Budget)'
        inputs:
          command: 'publish'
          publishWebProjects: false
          projects: 'BUDGET-APP/PlatinumBudget.Api/PlatinumBudget.Api.csproj'
          arguments: '-c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/budget'
          zipAfterPublish: true
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-Budget-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-Budget-Postgres-API'
          package: '$(Build.ArtifactStagingDirectory)/budget/**/*.zip'

  - job: Overtime_API
    displayName: 'Overtime → Platinum-V3-Overtime-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: UseDotNet@2
        inputs: { packageType: 'sdk', version: '10.0.x' }
      - task: DotNetCoreCLI@2
        displayName: 'dotnet publish (Overtime)'
        inputs:
          command: 'publish'
          publishWebProjects: false
          projects: 'OVERTIME-API/PlatinumOvertime-API.csproj'
          arguments: '-c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/overtime'
          zipAfterPublish: true
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-Overtime-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-Overtime-Postgres-API'
          package: '$(Build.ArtifactStagingDirectory)/overtime/**/*.zip'

  # ========== NODE POSTGRES APIs ==========
  - job: AFS_API
    displayName: 'AFS → Platinum-V3-AFS-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: NodeTool@0
        inputs: { versionSpec: '22.x' }
      - script: |
          cd AFS-UI/api
          npm ci --legacy-peer-deps    # installs tsx (runtime) + pg + express
        displayName: 'Install AFS API deps'
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-AFS-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-AFS-Postgres-API'
          runtimeStack: 'NODE|22-lts'
          package: 'AFS-UI/api'
          startUpCommand: 'npx tsx index.ts'

  - job: Payroll_API
    displayName: 'Payroll → Platinum-V3-Payroll-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: NodeTool@0
        inputs: { versionSpec: '22.x' }
      - script: |
          cd PAYROLL-APP
          npm ci --legacy-peer-deps
        displayName: 'Install Payroll API deps'
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-Payroll-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-Payroll-Postgres-API'
          runtimeStack: 'NODE|22-lts'
          package: 'PAYROLL-APP'
          startUpCommand: 'node src/server/index.js'   # adjust to PAYROLL-APP's real entry

  # Performance API (Insight-Performance-Hub/artifacts/api-server) - a separate
  # pnpm workspace vendored wholesale into this repo, NOT part of the outer npm
  # monorepo. Its own package.json blocks plain `npm install` (see the
  # "preinstall" guard) - needs pnpm via corepack. esbuild bundles everything
  # into one self-contained dist/index.cjs, so the deploy package is just that
  # one file - no node_modules, no Oryx build. The frontend is NOT deployed
  # separately - as of PerformanceSync.md "Pass 3" (2026-08-26) it's native
  # shell code (libs/ins), built by the Shell_UI job above; the standalone
  # perf-app under Insight-Performance-Hub/artifacts/perf-app is sync-source
  # only, not what renders in the browser.
  - job: Performance_API
    displayName: 'Performance → Platinum-V3-Performace-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: NodeTool@0
        inputs: { versionSpec: '22.x' }
      - script: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
        displayName: 'Install pnpm via corepack (pinned v10.33.4)'
      - script: |
          cd Insight-Performance-Hub
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            delete pkg.scripts.preinstall;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('preinstall guard removed for CI');
          "
        displayName: 'Remove preinstall guard (CI only)'
      - script: |
          cd Insight-Performance-Hub
          pnpm install --frozen-lockfile
        displayName: 'Install pnpm workspace dependencies'
      - script: |
          cd Insight-Performance-Hub
          pnpm --filter @workspace/api-server run build
        displayName: 'Build API (esbuild → dist/index.cjs)'
      - script: |
          set -e
          mkdir -p $(Build.ArtifactStagingDirectory)/performance
          cp Insight-Performance-Hub/artifacts/api-server/dist/index.cjs $(Build.ArtifactStagingDirectory)/performance/index.cjs
        displayName: 'Stage build output'
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-Performace-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-Performace-Postgres-API'
          runtimeStack: 'NODE|22-lts'
          package: '$(Build.ArtifactStagingDirectory)/performance'
          startUpCommand: 'node index.cjs'

  # POS auth + receipting API (Node/TypeScript via tsx; reads EMS_V3_* + EMS_TENANT_*
  # from this app's App Settings — see runbook). The shell proxies /pos-app/api here
  # via its POS_API_URL setting.
  - job: POS_API
    displayName: 'POS → Platinum-V3-POS-API'
    pool: { vmImage: $(vmImage) }
    steps:
      # Deploy SOURCE ONLY — do NOT bundle node_modules (the installed tree is large and the
      # zip-deploy fails/times out). Oryx runs `npm install` on the App Service instead
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true). The package.json "build" script is a no-op, so
      # Oryx's post-install build succeeds; the app then starts via `npm start`
      # (= NODE_ENV=production tsx index.ts), binding Azure's PORT.
      #
      # NODE_ENV=production forces Oryx's install to skip devDependencies — POS-API's front-end /
      # build packages (React, Radix, Tailwind, Vite, esbuild, …) live there and pull heavy
      # NATIVE binaries (tailwind-oxide, lightningcss, rollup) that the server-side install chokes
      # on. The backend (tsx index.ts) never imports them, so skipping them makes the deploy
      # reliable. Keep NODE_ENV=production BEFORE SCM_DO_BUILD so the install is production-only.
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-POS-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-POS-API'
          runtimeStack: 'NODE|22-lts'
          package: 'POS-API'
          startUpCommand: 'npm start'
          appSettings: '-NODE_ENV production -SCM_DO_BUILD_DURING_DEPLOYMENT true'

  # ═══════════════════════════════════════════════════════════════════════════
  # MBM customer stack (see Platinum-v3-deployment/docs/customer-onboarding.md)
  # Same application code as the base fleet above, deployed to MBM's own
  # App Services. MBM has no POS-API of its own - it authenticates through the
  # shared Platinum-V3-POS-API job above, via its UI's POS_API_URL setting.
  # ═══════════════════════════════════════════════════════════════════════════

  # ========== MBM: MAIN UI (Angular shell, Node runtime) ==========
  - job: Shell_UI_MBM
    displayName: 'Shell (MBM) → Platinum-V3-MBM-UI'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: NodeTool@0
        inputs: { versionSpec: '22.x' }
      - script: npm ci --legacy-peer-deps
        displayName: 'Install monorepo dependencies'
      - script: |
          cd apps/shell
          npx ng build --configuration production
        displayName: 'Build Angular shell (prod)'
      - script: |
          set -e
          PKG="$(Build.ArtifactStagingDirectory)/shell-mbm"
          mkdir -p "$PKG"
          cp apps/shell/server.js "$PKG/"
          cp apps/shell/package.json "$PKG/"
          cp -r dist/shell/browser "$PKG/browser"
          # bundle the 3 runtime deps so the app starts without an Oryx build
          (cd "$PKG" && npm install --omit=dev)
        displayName: 'Assemble shell deploy package'
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-MBM-UI'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-MBM-UI'
          runtimeStack: 'NODE|22-lts'
          package: '$(Build.ArtifactStagingDirectory)/shell-mbm'
          startUpCommand: 'node server.js'

  # ========== MBM: .NET POSTGRES APIs ==========
  - job: IDP_API_MBM
    displayName: 'IDP (MBM) → Platinum-V3-MBM-IDP-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: UseDotNet@2
        inputs: { packageType: 'sdk', version: '10.0.x' }
      - task: DotNetCoreCLI@2
        displayName: 'dotnet publish (IDP)'
        inputs:
          command: 'publish'
          publishWebProjects: false
          projects: 'IDP-UI/PlatinumIDP/PlatinumIDP.csproj'
          arguments: '-c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/idp-mbm'
          zipAfterPublish: true
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-MBM-IDP-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-MBM-IDP-Postgres-API'
          package: '$(Build.ArtifactStagingDirectory)/idp-mbm/**/*.zip'

  - job: Budget_API_MBM
    displayName: 'Budget (MBM) → Platinum-V3-MBM-Budget-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: UseDotNet@2
        inputs: { packageType: 'sdk', version: '10.0.x' }
      - task: DotNetCoreCLI@2
        displayName: 'dotnet publish (Budget)'
        inputs:
          command: 'publish'
          publishWebProjects: false
          projects: 'BUDGET-APP/PlatinumBudget.Api/PlatinumBudget.Api.csproj'
          arguments: '-c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/budget-mbm'
          zipAfterPublish: true
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-MBM-Budget-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-MBM-Budget-Postgres-API'
          package: '$(Build.ArtifactStagingDirectory)/budget-mbm/**/*.zip'

  - job: Overtime_API_MBM
    displayName: 'Overtime (MBM) → Platinum-V3-MBM-Overtime-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: UseDotNet@2
        inputs: { packageType: 'sdk', version: '10.0.x' }
      - task: DotNetCoreCLI@2
        displayName: 'dotnet publish (Overtime)'
        inputs:
          command: 'publish'
          publishWebProjects: false
          projects: 'OVERTIME-API/PlatinumOvertime-API.csproj'
          arguments: '-c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/overtime-mbm'
          zipAfterPublish: true
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-MBM-Overtime-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
          appType: 'webAppLinux'
          appName: 'Platinum-V3-MBM-Overtime-Postgres-API'
          package: '$(Build.ArtifactStagingDirectory)/overtime-mbm/**/*.zip'

  # ========== MBM: NODE POSTGRES APIs ==========
  - job: AFS_API_MBM
    displayName: 'AFS (MBM) → Platinum-V3-MBM-AFS-Postgres-API'
    pool: { vmImage: $(vmImage) }
    steps:
      - task: NodeTool@0
        inputs: { versionSpec: '22.x' }
      - script: |
          cd AFS-UI/api
          npm ci --legacy-peer-deps    # installs tsx (runtime) + pg + express
        displayName: 'Install AFS API deps'
      - task: AzureWebApp@1
        displayName: 'Deploy to Platinum-V3-MBM-AFS-Postgres-API'
        inputs:
          azureSubscription: $(azureSubscription)
